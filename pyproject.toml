[project]
name = "quantlab"
version = "0.1.0"
description = "Self-hosted quantitative trading platform built around QuantConnect LEAN"
readme = "README.md"
requires-python = ">=3.11,<3.12"   # pinned to LEAN's embedded Python (DEC-0002)
license = { text = "Proprietary (personal use)" }
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: requires a running Docker daemon (skipped otherwise)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "tools"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "DTZ"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
"tools/**" = ["PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/quantlab"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["quantlab"]
branch = true
