[project]
name = "quantlab"
version = "0.1.0"
description = "Self-hosted quantitative trading platform built around QuantConnect LEAN"
readme = "README.md"
requires-python = ">=3.11,<3.12"   # pinned to LEAN's embedded Python (DEC-0002)
license = { text = "Proprietary (personal use)" }
dependencies = [
    "alembic>=1.14",
    "duckdb>=1.1",
    "exchange-calendars>=4.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring>=25.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<3",
    "structlog>=24.4",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
quantlab = "quantlab.cli.main:main"

[project.optional-dependencies]
research = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
]
ibkr = [
    "ib_async>=2.1,<3",  # BSD-2; TWS API client for IB Gateway / TWS (DATA-019)
]
optimize = [
    "optuna>=4.8,<6",  # MIT; Bayesian (TPE) and multi-objective search (OPT-002)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "ib_async>=2.1,<3",  # adapter type-checks and translation tests (no network)
    "optuna>=4.8,<6",  # OPT-002 tests
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: requires a running Docker daemon (skipped otherwise)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "tools"]
extend-exclude = ["docs", "*.md"]  # prose is never reformatted by the code formatter

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "DTZ"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
"tools/**" = ["PTH"]
"src/quantlab/analytics/report.py" = ["E501"]  # HTML/CSS template text
"src/quantlab/engine/lean/library/**" = ["PTH"]  # runs inside LEAN's Python; os.path is fine

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/quantlab"]
exclude = ["src/quantlab/engine/lean/library/"]  # runs inside LEAN (AlgorithmImports), not type-checkable here
plugins = ["pydantic.mypy"]

# Third-party libraries without usable type information (pandas-stubs lags pandas 3). QuantLab code stays strict;
# values from these libraries are typed Any at the boundary.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pyarrow", "pyarrow.*", "exchange_calendars", "exchange_calendars.*", "duckdb"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["quantlab"]
branch = true

# Module boundary contracts (docs/ARCHITECTURE.md §7, docs/MODULE_OWNERSHIP.md). Run: uv run lint-imports
[tool.importlinter]
root_package = "quantlab"

[[tool.importlinter.contracts]]
name = "layered architecture (ARCHITECTURE.md section 7)"
type = "layers"
layers = [
    "quantlab.cli",
    "quantlab.api | quantlab.research",
    "quantlab.bootstrap",
    "quantlab.migrations",
    "quantlab.optimize",
    "quantlab.backtest",
    "quantlab.strategies | quantlab.analytics | quantlab.engine | quantlab.data",
    "quantlab.core",
]

[[tool.importlinter.contracts]]
name = "analytics is pure: depends on nothing else in quantlab"
type = "forbidden"
source_modules = ["quantlab.analytics"]
forbidden_modules = ["quantlab.core", "quantlab.engine", "quantlab.strategies", "quantlab.backtest"]

[[tool.importlinter.contracts]]
name = "backtest uses the engine abstraction, not LEAN internals"
type = "forbidden"
source_modules = ["quantlab.backtest"]
forbidden_modules = ["quantlab.engine.lean"]
